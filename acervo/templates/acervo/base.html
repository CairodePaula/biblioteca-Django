{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Biblioteca{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'acervo/estilo.css' %}">
</head>
<body>
<header>
    <div class="container header-inner">
        <h1>Biblioteca</h1>
        <nav>
            <a href="{% url 'lista' %}">Acervo</a>
            <a href="{% url 'novo_livro' %}">Cadastrar livro</a>
            <a href="/admin/">Admin</a>
        </nav>
    </div>
</header>

<main class="container">
    {% block conteudo %}{% endblock %}
</main>

<footer>
    <p>© 2026 - Biblioteca</p>
</footer>
</body>
</html>
