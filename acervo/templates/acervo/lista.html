{% extends "acervo/base.html" %}

{% block titulo %}Acervo - Biblioteca{% endblock %}

{% block conteudo %}
<h2>Acervo de Livros</h2>

<div class="book-grid">
    {% for livro in livros %}
    <article class="book-card">
        <h3>{{ livro.titulo }}</h3>
        <p><strong>Autor:</strong> {{ livro.autor }}</p>
        <p><strong>Ano:</strong> {{ livro.ano }}</p>
    </article>
    {% empty %}
    <div class="empty">
        <h3>Nenhum livro cadastrado.</h3>
    </div>
    {% endfor %}
</div>
{% endblock %}
